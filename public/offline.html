<!doctype html>
<!-- Fork: Flytower name and mark. English only on purpose: this is a static file served from the service worker cache while offline,
     outside the app's i18n (catalogs load over the network and the locale comes from a server-read cookie). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Offline - Flytower Mail</title>
<style>
:root { color-scheme: light dark; --bg: #f6f8fc; --fg: #202124; --muted: #5f6368; }
@media (prefers-color-scheme: dark) { :root { --bg: #202124; --fg: #e8eaed; --muted: #9aa0a6; } }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
body { display: flex; min-height: 100dvh; align-items: center; justify-content: center; padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) env(safe-area-inset-bottom) max(16px, env(safe-area-inset-left)); box-sizing: border-box; }
main { max-width: 360px; text-align: center; }
svg { width: 72px; height: 72px; }
h1 { font-size: 20px; margin: 16px 0 8px; font-weight: 600; }
p { margin: 0 0 20px; color: var(--muted); }
button { font: inherit; padding: 10px 20px; border: 0; border-radius: 999px; background: #0b57d0; color: #fff; cursor: pointer; }
button:focus-visible { outline: 3px solid #0b57d0; outline-offset: 3px; }
@media (prefers-color-scheme: dark) { button { background: #8ab4f8; color: #202124; } }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#1B2231"/><rect x="5" y="5" width="22" height="2.5" rx="1" fill="#AEB9CB"/><path d="M10 7.5V22.5M22 7.5V22.5" stroke="#627390" stroke-width="1.25"/><rect x="7" y="10.5" width="18" height="3.5" rx="1" fill="#4C5B76"/><rect x="7" y="16" width="18" height="3.5" rx="1" fill="#4C5B76"/><rect x="7" y="22.5" width="18" height="4.5" rx="1.25" fill="#F2A93B"/></svg>
<h1>You are offline</h1>
<p>Flytower Mail cannot reach the server right now. Check your connection and try again.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
